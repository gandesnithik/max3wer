<script>
/* Lumora persistence. Mirrors the app's saved keys (accounts, sign-in, data, theme) into the
   viewer's private space, so a reload finds them even when the browser drops local storage. */
(()=>{
const own=Object.prototype.hasOwnProperty;
const kv={};
let ref=null,ready=false,busy=false,dirty=false,off=false,timer=0;

function flush(){
  if(!ref||!ready||off)return;
  if(busy){dirty=true;return}
  clearTimeout(timer);
  timer=setTimeout(async()=>{
    busy=true;dirty=false;
    try{await ref.set({kv:kv,saved:new Date().toISOString()})}
    catch(e){if(e&&(e.code==='invalid_argument'||e.code==='revoked'||e.code==='not_granted'||e.code==='quota_exceeded'))off=true}
    busy=false;
    if(dirty&&!off)flush();
  },800);
}
window.__lmSync=(k,v)=>{
  if(!/^lm_/.test(k))return;
  if(v===null||v===undefined)delete kv[k];else kv[k]=String(v);
  flush();
};
function localKeys(){
  const o={};
  try{for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i);if(/^lm_/.test(k)){const v=localStorage.getItem(k);if(v!==null)o[k]=v}}}catch(e){}
  try{Object.keys(MEM).forEach(k=>{if(/^lm_/.test(k)&&!own.call(o,k))o[k]=MEM[k]})}catch(e){}
  return o;
}

(async()=>{
  try{
    if(!window.claude)return;
    const[db,user]=await Promise.all([claude.use('db'),claude.use('user')]);
    if(!db||!user)return;
    if(user.can&&user.can('data.write')===false)return;
    const id=await user.id();
    if(!id)return;
    ref=db.collection('data/users/'+id).doc('lumora');
    const snap=await ref.get();
    const remote=(snap.exists&&snap.data()&&snap.data().kv)||{};
    const local=localKeys();
    Object.assign(kv,remote,local);
    const restored=Object.keys(remote).filter(k=>!own.call(local,k)&&typeof remote[k]==='string');
    ready=true;
    restored.forEach(k=>ls(k,remote[k]));
    if(restored.length||Object.keys(local).some(k=>remote[k]!==local[k]))flush();
    if(!restored.length)return;

    const nu=ls('lm_u')||'';
    let langChanged=false;
    if(restored.includes('lm_lg')){const g=ls('lm_lg');if((g==='de'||g==='en')&&g!==LG){LG=g;langChanged=true}}
    if(restored.includes('lm_th')){
      const t=ls('lm_th');
      if(TH.some(x=>x[0]===t)){TM=t;document.documentElement.dataset.theme=TM}
    }
    if(restored.includes('lm_u')&&nu&&!U){
      U=nu;S=load();V='app';R='today';go();
    }else if(U&&restored.includes('lm_d_'+U)){
      S=load();
      if(V==='app')go();
    }
    if(langChanged)go();
  }catch(e){}
})();
})();
</script>
<script>
/* Lumora cloud accounts. Account + progress live in the shared database, encrypted with a key
   derived from the password (PBKDF2 -> AES-GCM). Same email + password works on any device. */
(()=>{
const enc=new TextEncoder(),dec=new TextDecoder();
const b64=u=>{u=new Uint8Array(u);let s='';for(let i=0;i<u.length;i+=32768)s+=String.fromCharCode.apply(null,u.subarray(i,i+32768));return btoa(s)};
const unb=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
const hex=u=>[...new Uint8Array(u)].map(x=>x.toString(16).padStart(2,'0')).join('');
const sha=async s=>hex(await crypto.subtle.digest('SHA-256',typeof s=='string'?enc.encode(s):s));
const lsg=k=>{try{return localStorage.getItem(k)}catch(e){return null}};
const lss=(k,v)=>{try{v===null?localStorage.removeItem(k):localStorage.setItem(k,v)}catch(e){}};
let col=null,rdy=null,sess=null,timer=0,busy=false,dirty=false,adopting=false,changed=false,lastRemote=+(lsg('lk_rt')||0);

function ready(){
  if(rdy)return rdy;
  rdy=(async()=>{
    try{
      if(!window.claude||!window.crypto||!crypto.subtle)return false;
      const db=await claude.use('db');
      if(!db)return false;
      col=db.collection('lumora_acct');
      return true;
    }catch(e){return false}
  })();
  rdy.then(v=>{if(!v)rdy=null});
  return rdy;
}
async function derive(pw,salt){
  const km=await crypto.subtle.importKey('raw',enc.encode(pw),'PBKDF2',false,['deriveBits']);
  const bits=new Uint8Array(await crypto.subtle.deriveBits({name:'PBKDF2',hash:'SHA-256',salt:salt,iterations:200000},km,512));
  return{ver:await sha(bits.slice(0,32)),raw:bits.slice(32)};
}
const imp=raw=>crypto.subtle.importKey('raw',raw,'AES-GCM',false,['encrypt','decrypt']);
async function pipe(bytes,T){
  const st=new Blob([bytes]).stream().pipeThrough(new T('gzip'));
  return new Uint8Array(await new Response(st).arrayBuffer());
}
async function seal(key,obj){
  const iv=crypto.getRandomValues(new Uint8Array(12));
  let raw=enc.encode(JSON.stringify(obj)),z=0;
  if(window.CompressionStream){try{raw=await pipe(raw,CompressionStream);z=1}catch(e){raw=enc.encode(JSON.stringify(obj));z=0}}
  const ct=new Uint8Array(await crypto.subtle.encrypt({name:'AES-GCM',iv:iv},key,raw));
  const o=new Uint8Array(12+ct.length);o.set(iv);o.set(ct,12);
  return{blob:b64(o),z:z};
}
async function open(key,blob,z){
  const u=unb(blob);
  let raw=new Uint8Array(await crypto.subtle.decrypt({name:'AES-GCM',iv:u.slice(0,12)},key,u.slice(12)));
  if(z)raw=await pipe(raw,DecompressionStream);
  return JSON.parse(dec.decode(raw));
}
const prefs=()=>({lg:LG,th:TM});
function setSess(m,key){sess={u:m.u,eid:m.eid,key:key};lss('lk_s',JSON.stringify(m))}
const eidOf=k=>sha('lumora:acct:'+k);

async function signup(k,pw,d){
  if(!await ready())return{err:'net'};
  try{
    const eid=await eidOf(k),ref=col.doc(eid),snap=await ref.get();
    if(snap.exists)return{err:'exists'};
    const salt=crypto.getRandomValues(new Uint8Array(16)),dv=await derive(pw,salt),key=await imp(dv.raw),t=Date.now();
    const sl=await seal(key,{t:t,d:d,p:prefs()});
    await ref.set({v:1,salt:b64(salt),ver:dv.ver,blob:sl.blob,z:sl.z,t:t});
    setSess({u:k,eid:eid,raw:b64(dv.raw)},key);
    lastRemote=t;lss('lk_rt',String(t));lss('lk_lt',String(t));
    return{ok:true};
  }catch(e){return{err:'net'}}
}
async function signin(k,pw){
  if(!await ready())return{err:'net'};
  try{
    const eid=await eidOf(k),snap=await col.doc(eid).get();
    if(!snap.exists)return{err:'none'};
    const o=snap.data(),dv=await derive(pw,unb(o.salt));
    if(dv.ver!==o.ver)return{err:'wrong'};
    const key=await imp(dv.raw),x=await open(key,o.blob,o.z);
    setSess({u:k,eid:eid,raw:b64(dv.raw)},key);
    lastRemote=o.t;lss('lk_rt',String(o.t));lss('lk_lt',String(o.t));
    return{ok:true,d:x.d,p:x.p};
  }catch(e){return{err:'net'}}
}

function schedule(){if(!sess)return;clearTimeout(timer);timer=setTimeout(push,1200)}
async function push(){
  clearTimeout(timer);
  const s=sess;
  if(!s||!col||U!==s.u||!changed)return;
  if(busy){dirty=true;return}
  busy=true;dirty=false;changed=false;
  try{
    const d=JSON.parse(ls('lm_d_'+s.u)||'null');
    if(d){
      const t=Date.now(),sl=await seal(s.key,{t:t,d:d,p:prefs()});
      await col.doc(s.eid).update({blob:sl.blob,z:sl.z,t:t});
      lastRemote=t;lss('lk_rt',String(t));
    }
  }catch(e){changed=true}
  busy=false;
  if(dirty&&sess)push();
}
function adopt(x,t){
  adopting=true;
  try{
    ls('lm_d_'+U,JSON.stringify(x.d));
    lastRemote=t;lss('lk_rt',String(t));lss('lk_lt',String(t));
    S=load();
    const p=x.p||{};
    if(p.lg=='de'||p.lg=='en'){LG=p.lg;ls('lm_lg',LG)}
    if(TH.some(a=>a[0]==p.th)){TM=p.th;ls('lm_th',TM);document.documentElement.dataset.theme=TM}
    const dlg=document.getElementById('dlg');
    if(V=='app'&&!(dlg&&dlg.open))go();
  }finally{adopting=false}
}
async function pull(){
  const s=sess;
  if(!s||!col||U!==s.u||busy||adopting||changed)return;
  try{
    const snap=await col.doc(s.eid).get();
    if(!snap.exists)return;
    const o=snap.data(),ll=+(lsg('lk_lt')||0);
    if(o.t>lastRemote&&o.t>ll){adopt(await open(s.key,o.blob,o.z),o.t)}
    else if(ll>lastRemote){changed=true;schedule()}
  }catch(e){}
}
function signout(){
  if(sess&&changed)push();
  clearTimeout(timer);
  sess=null;lss('lk_s',null);lss('lk_rt',null);lss('lk_lt',null);lastRemote=0;
}

/* keep every local save in sync with the account */
const w0=window.__lmSync;
window.__lmSync=(k,v)=>{
  try{w0&&w0(k,v)}catch(e){}
  if(adopting||!sess)return;
  if(k==='lm_d_'+sess.u||k==='lm_lg'||k==='lm_th'){lss('lk_lt',String(Date.now()));changed=true;schedule()}
};

/* on load: reuse the saved key, or ask for a fresh sign-in if this device has none */
async function checkKey(){
  if(sess&&U===sess.u)return;
  if(U&&!sess){
    U='';ls('lm_u',null);S=load();V='auth';AU='in';go();
    const e=document.getElementById('ae');if(e)e.textContent='Please sign in again to sync your progress.';
  }
}
(async()=>{
  if(!await ready())return;
  try{
    const m=JSON.parse(lsg('lk_s')||'null');
    if(m&&m.u&&m.raw&&m.eid)sess={u:m.u,eid:m.eid,key:await imp(unb(m.raw))};
  }catch(e){sess=null}
  await checkKey();
  setTimeout(checkKey,2500);
  if(sess)pull();
})();
document.addEventListener('visibilitychange',()=>{if(document.hidden){if(changed)push()}else pull()});
addEventListener('pagehide',()=>{if(changed)push()});
setInterval(()=>{if(!document.hidden)pull()},45000);

window.LMC={ready:ready,signup:signup,signin:signin,signout:signout};
})();
</script>
<script>
/* Lumora usage tracking. One small record per signed-in Claude viewer.
   Never blocks or changes the app: every call is wrapped and fails silently. */
(()=>{
const clone=o=>JSON.parse(JSON.stringify(o));
const iso=()=>new Date().toISOString();
const dev=()=>innerWidth<800?'mobile':'desktop';
const sget=k=>{try{return sessionStorage.getItem(k)}catch(e){return null}};
const sset=(k,v)=>{try{sessionStorage.setItem(k,v)}catch(e){}};
let st=null,ref=null,timer=0,busy=false,dirty=false,off=false,dead=false,visited=false;
const pend=[];

function flush(){
  if(!ref||!st||off)return;
  if(busy){dirty=true;return}
  clearTimeout(timer);
  timer=setTimeout(async()=>{
    busy=true;dirty=false;
    try{await ref.set(st)}catch(e){if(e&&(e.code==='invalid_argument'||e.code==='revoked'||e.code==='not_granted'))off=true}
    busy=false;
    if(dirty&&!off)flush();
  },1500);
}
function today(){
  const d=T();
  const x=st.days[d]||(st.days[d]={v:0,l:0,f:0,s:0,p:{}});
  if(!x.p)x.p={};
  return x;
}
function rec(k,page){
  if(!st||off)return;
  try{
    const x=today();
    if(k==='page'){x.p[page]=(x.p[page]||0)+1}
    else{
      x[{visit:'v',login:'l',fail:'f',signup:'s'}[k]]++;
      st.ev.push({t:iso(),k:k,d:dev()});
      if(st.ev.length>60)st.ev=st.ev.slice(-60);
    }
    st.last=iso();st.dev=dev();
    const keys=Object.keys(st.days).sort();
    if(keys.length>180)keys.slice(0,keys.length-180).forEach(d=>delete st.days[d]);
    flush();
  }catch(e){}
}
function track(k,page){
  if(st)rec(k,page);
  else if(!dead)pend.push([k,page]);
}
function visit(){
  if(visited||location.hash==='#admin'||sget('lm_vs'))return;
  visited=true;sset('lm_vs','1');
  track('visit');
}

(async()=>{
  try{
    if(!window.claude)throw 0;
    const[db,user]=await Promise.all([claude.use('db'),claude.use('user')]);
    if(!db||!user)throw 0;
    if(user.can&&user.can('data.write')===false)throw 0;
    const id=await user.id();
    if(!id)throw 0;
    ref=db.collection('visitors').doc(id);
    const s=await ref.get();
    st=s.exists?clone(s.data()):{};
    st.first=st.first||iso();
    st.days=st.days||{};
    st.ev=Array.isArray(st.ev)?st.ev:[];
    pend.splice(0).forEach(a=>rec(a[0],a[1]));
  }catch(e){dead=true;pend.length=0}
})();

/* hook the app's own actions, keeping their behaviour exactly as it was */
try{
  const nav0=A.nav;
  if(typeof nav0==='function'){
    A.nav=function(k){
      const r=nav0.apply(this,arguments);
      try{if(/^[a-z]{1,12}$/.test(String(k)))track('page',String(k))}catch(e){}
      return r;
    };
  }
  const auth0=A.auth;
  if(typeof auth0==='function'){
    A.auth=async function(m){
      const before=U;
      const r=await auth0.apply(this,arguments);
      try{
        const err=(document.querySelector('#ae')||{}).textContent||'';
        if(U&&U!==before)track(m==='new'?'signup':'login');
        else if(m==='in'&&/wrong email or password|falsche e-mail/i.test(err))track('fail');
      }catch(e){}
      return r;
    };
  }
}catch(e){}

visit();
addEventListener('hashchange',()=>{if(location.hash!=='#admin')visit()});
})();
</script>
<script>

(()=>{
const root=document.getElementById('adm'),app=document.getElementById('app');
if(!root||!app)return;
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const N=x=>Number.isFinite(+x)?+x:0;
const p2=n=>String(n).padStart(2,'0');
const dstr=d=>d.getFullYear()+'-'+p2(d.getMonth()+1)+'-'+p2(d.getDate());
const addD=(s,n)=>{const d=new Date(s+'T12:00:00');d.setDate(d.getDate()+n);return dstr(d)};
const SEC={today:'Today',plan:'Planner',tasks:'Tasks',exams:'Exams',subj:'Subjects',focus:'Focus',garden:'Garden',pp:'Pluspoints',ai:'Lumora AI',set:'Settings'};
const EVL={visit:'Visit',login:'Signed in',fail:'Failed sign-in',signup:'New account'};
const lab=s=>{const d=new Date(s+'T12:00:00');return d.toLocaleDateString('en-GB',{day:'numeric',month:'short'})};
const ago=t=>{const s=(Date.now()-new Date(t))/1000;if(!(s>=0))return'';if(s<60)return'just now';if(s<3600)return Math.floor(s/60)+' min ago';if(s<86400)return Math.floor(s/3600)+' h ago';return Math.floor(s/86400)+' d ago'};
const when=t=>{const d=new Date(t);return isNaN(d)?'':d.toLocaleString('en-GB',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'})};
const short=id=>String(id).replace(/[^A-Za-z0-9]/g,'').slice(0,6)||'visitor';

let rows=[],range=30,sample=false,sampleRows=null,state='load',started=false,locked=false,live=false,timerId=0;
const data=()=>sample?(sampleRows||(sampleRows=makeSample())):rows;

function makeSample(){
  let s=11;const rnd=()=>(s=(s*16807)%2147483647)/2147483647;
  const t=dstr(new Date()),keys=Object.keys(SEC),out=[];
  for(let i=0;i<46;i++){
    const off=Math.floor(rnd()*70),days={},ev=[];
    for(let d=off;d>=0;d--){
      if(d!==off&&rnd()>0.33)continue;
      const key=addD(t,-d),v=1+Math.floor(rnd()*3),l=rnd()<0.6?1:0,f=rnd()<0.12?1:0,sg=d===off?1:0,p={};
      for(let j=0;j<1+Math.floor(rnd()*4);j++){const k=keys[Math.floor(rnd()*keys.length)];p[k]=(p[k]||0)+1}
      days[key]={v,l,f,s:sg,p};
      const hh=8+Math.floor(rnd()*13),dv=rnd()<0.55?'mobile':'desktop';
      ev.push({t:key+'T'+p2(hh)+':'+p2(Math.floor(rnd()*60))+':00',k:'visit',d:dv});
      if(l)ev.push({t:key+'T'+p2(hh)+':'+p2(Math.floor(rnd()*60))+':30',k:'login',d:dv});
      if(f)ev.push({t:key+'T'+p2(hh)+':'+p2(Math.floor(rnd()*60))+':10',k:'fail',d:dv});
    }
    const ks=Object.keys(days).sort();
    out.push({id:'s'+(100000+Math.floor(rnd()*899999)).toString(36),data:{first:ks[0]+'T09:00:00',last:ks[ks.length-1]+'T12:00:00',dev:rnd()<0.55?'mobile':'desktop',days,ev}});
  }
  return out;
}

function dayList(n){const t=dstr(new Date());const o=[];for(let i=n-1;i>=0;i--)o.push(addD(t,-i));return o}
function span(){
  if(range!=='all')return range;
  let first=null;
  data().forEach(r=>Object.keys(r.data.days||{}).forEach(d=>{if(!first||d<first)first=d}));
  if(!first)return 30;
  const n=Math.round((new Date(dstr(new Date())+'T12:00:00')-new Date(first+'T12:00:00'))/864e5)+1;
  return Math.max(7,Math.min(180,n));
}
function sum(list){
  const o={v:0,l:0,f:0,s:0,uv:new Set(),days:{},pages:{},dev:{mobile:0,desktop:0},nv:0,rv:0};
  list.forEach(d=>{o.days[d]={v:0,l:0,f:0,s:0}});
  const inR=new Set(list);
  data().forEach(r=>{
    const D=r.data.days||{};let seen=false;
    list.forEach(d=>{
      const x=D[d];if(!x)return;
      const t=o.days[d];
      t.v+=N(x.v);t.l+=N(x.l);t.f+=N(x.f);t.s+=N(x.s);
      o.v+=N(x.v);o.l+=N(x.l);o.f+=N(x.f);o.s+=N(x.s);
      if(N(x.v)>0)seen=true;
      Object.entries(x.p||{}).forEach(e=>{o.pages[e[0]]=(o.pages[e[0]]||0)+N(e[1])});
    });
    if(seen){
      o.uv.add(r.id);
      o.dev[r.data.dev==='mobile'?'mobile':'desktop']++;
      const fd=new Date(r.data.first);
      if(!isNaN(fd)&&inR.has(dstr(fd)))o.nv++;else o.rv++;
    }
  });
  return o;
}
function delta(cur,prev,badUp){
  if(prev==null)return'<span class="dl">all recorded time</span>';
  if(!cur&&!prev)return'<span class="dl">no change</span>';
  if(!prev)return'<span class="dl">new this period</span>';
  const p=Math.round((cur-prev)/prev*100);
  if(!p)return'<span class="dl">same as before</span>';
  const up=p>0,bad=badUp?up:!up;
  return'<span class="dl '+(bad?'bad':'good')+'">'+(up?'▲ ':'▼ ')+Math.abs(p)+'% vs before</span>';
}
function nice(m){
  if(m<=4)return 4;
  const p=Math.pow(10,Math.floor(Math.log10(m/4)));
  for(const f of [1,2,5,10])if(f*p*4>=m)return f*p*4;
  return m;
}
function chart(c,list){
  const W=720,H=244,L=34,R=12,T=12,B=26,n=list.length,iw=W-L-R,ih=H-T-B;
  const vals=list.map(d=>c.days[d]);
  const mx=nice(Math.max(1,...vals.map(x=>Math.max(x.v,x.l))));
  const X=i=>L+(n>1?i*iw/(n-1):iw/2),Y=v=>T+ih-v/mx*ih;
  let g='';
  for(let k=0;k<=4;k++){const v=mx*k/4,y=Y(v);g+='<line class="gr" x1="'+L+'" x2="'+(W-R)+'" y1="'+y+'" y2="'+y+'"/><text x="'+(L-6)+'" y="'+(y+4)+'" text-anchor="end">'+v+'</text>'}
  const idx=n<=8?list.map((_,i)=>i):[0,1,2,3,4].map(k=>Math.round(k*(n-1)/4));
  idx.forEach((i,k)=>{const a=idx.length===1?'middle':k===0?'start':k===idx.length-1?'end':'middle';g+='<text x="'+X(i)+'" y="'+(H-7)+'" text-anchor="'+a+'">'+lab(list[i])+'</text>'});
  const pts=k=>vals.map((x,i)=>X(i).toFixed(1)+','+Y(x[k]).toFixed(1)).join(' ');
  const area='M'+X(0).toFixed(1)+','+(T+ih)+' L'+pts('v').split(' ').join(' L')+' L'+X(n-1).toFixed(1)+','+(T+ih)+' Z';
  const last=vals[n-1];
  const lab2='Visits and sign-ins per day. Total '+c.v+' visits and '+c.l+' sign-ins.';
  return'<svg class="ch" id="chsvg" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="'+esc(lab2)+'">'+g+
    '<path class="ar" d="'+area+'"/><polyline class="lv" points="'+pts('v')+'"/><polyline class="ll" points="'+pts('l')+'"/>'+
    '<line class="gl" id="gl" y1="'+T+'" y2="'+(T+ih)+'" x1="0" x2="0" visibility="hidden"/>'+
    '<circle class="ev" cx="'+X(n-1)+'" cy="'+Y(last.v)+'" r="4.5"/><circle class="el" cx="'+X(n-1)+'" cy="'+Y(last.l)+'" r="4.5"/>'+
    '<rect id="hit" x="'+L+'" y="'+T+'" width="'+iw+'" height="'+ih+'" fill="transparent"/></svg>';
}
function readout(list,c,i){
  const d=list[i],x=c.days[d];
  return'<b>'+lab(d)+'</b> · '+x.v+' visit'+(x.v===1?'':'s')+' · '+x.l+' sign-in'+(x.l===1?'':'s')+(x.f?' · '+x.f+' failed':'');
}
function bars(pages){
  const e=Object.entries(pages).sort((a,b)=>b[1]-a[1]).slice(0,8);
  if(!e.length)return'<p class="mut">No section has been opened in this period.</p>';
  const m=e[0][1];
  return e.map(x=>'<div class="hb"><span>'+esc(SEC[x[0]]||x[0])+'</span><span class="tr"><i style="width:'+Math.max(3,Math.round(x[1]/m*100))+'%"></i></span><b>'+x[1]+'</b></div>').join('');
}
function activity(){
  const all=[];
  data().forEach(r=>(Array.isArray(r.data.ev)?r.data.ev:[]).forEach(e=>{if(e&&EVL[e.k])all.push({id:r.id,t:String(e.t||''),k:e.k,d:e.d==='mobile'?'Mobile':'Desktop'})}));
  all.sort((a,b)=>a.t<b.t?1:a.t>b.t?-1:0);
  return all.slice(0,30);
}
function shell(inner,ctl){
  const st=sample?'Showing sample data':state==='ok'&&live?'Live':state==='slow'?'Cannot reach the data yet':state==='err'?'Could not load the data':state==='nodb'?'Sign in to Claude to see the data':'Connecting…';
  const cls=sample?'':state==='ok'&&live?'live':state==='slow'||state==='err'||state==='nodb'?'warn':'';
  return'<div class="a-wrap"><header class="a-top"><div class="a-brand"><span class="a-kick">Lumora admin</span><h1>How Lumora is being used</h1><span class="a-status"><i class="a-dot '+cls+'"></i>'+st+'</span></div><div class="a-ctl">'+(ctl||'')+'<button class="ghost" data-act="back">Back to Lumora</button></div></header>'+inner+'</div>';
}
function render(){
  if(locked){
    root.innerHTML=shell('<div class="note"><h2>Admin only</h2><p>Only the owner of this Lumora page, and editors the owner invites, can see these numbers. Sign in to Claude with that account and reload.</p></div>');
    return;
  }
  const n=span(),list=dayList(n),cur=sum(list);
  const prev=range==='all'?null:sum(dayList(n*2).slice(0,n));
  const ctl='<div class="seg" role="group" aria-label="Time range">'+[[7,'7 days'],[30,'30 days'],[90,'90 days'],['all','All']].map(r=>'<button data-r="'+r[0]+'" aria-pressed="'+(String(range)===String(r[0]))+'">'+r[1]+'</button>').join('')+'</div>';
  const empty=!sample&&rows.length===0;
  const kp=(l,v,pv,bad)=>'<div class="kpi"><span class="a-kick">'+l+'</span><b>'+v+'</b>'+delta(v,pv,bad)+'</div>';
  const kpis='<section class="kpis" aria-label="Totals">'+kp('Visits',cur.v,prev&&prev.v)+kp('Visitors',cur.uv.size,prev&&prev.uv.size)+kp('Sign-ins',cur.l,prev&&prev.l)+kp('Failed sign-ins',cur.f,prev&&prev.f,true)+kp('New accounts',cur.s,prev&&prev.s)+'</section>';
  let body='';
  if(sample)body+='<div class="banner"><span><b>Sample data.</b> These numbers are made up to show the layout.</span><button class="ghost" data-act="real">Show real data</button></div>';
  if(empty)body+='<div class="panel"><div class="empty"><h2>No activity recorded yet</h2><p>Visits and sign-ins appear here once someone opens Lumora while signed in to Claude with Contributor access or higher. Open Lumora in another tab to record the first visit.</p><button class="ghost" data-act="sample">Preview with sample data</button></div></div>';
  const tot=cur.l+cur.f,rate=tot?Math.round(cur.l/tot*100):null;
  const dv=cur.dev.mobile+cur.dev.desktop,mp=dv?Math.round(cur.dev.mobile/dv*100):0;
  const nr=cur.nv+cur.rv,np=nr?Math.round(cur.nv/nr*100):0;
  body+=kpis;
  body+='<section class="panel"><div class="head"><h2>Visits and sign-ins per day</h2><div class="key"><span><i style="background:var(--a-plum)"></i>Visits</span><span><i style="background:var(--a-sage)"></i>Sign-ins</span></div></div>'+chart(cur,list)+'<div class="ro" id="ro">'+readout(list,cur,list.length-1)+'</div></section>';
  body+='<div class="trio">'+
    '<section class="panel"><h2>Sign-in health</h2><span class="big">'+(rate==null?'–':rate+'%')+'</span><div class="split" aria-hidden="true"><i style="width:'+(tot?cur.l/tot*100:0)+'%;background:var(--a-sage)"></i><i style="width:'+(tot?cur.f/tot*100:0)+'%;background:var(--a-rose)"></i></div><div class="lgd"><span>Succeeded <b>'+cur.l+'</b></span><span>Failed <b>'+cur.f+'</b></span><span>New accounts <b>'+cur.s+'</b></span></div></section>'+
    '<section class="panel"><h2>Where people go</h2>'+bars(cur.pages)+'</section>'+
    '<section class="panel"><h2>Who visits</h2><div class="split" aria-hidden="true"><i style="width:'+mp+'%;background:var(--a-plum)"></i></div><div class="lgd"><span>Phone <b>'+mp+'%</b></span><span>Computer <b>'+(dv?100-mp:0)+'%</b></span></div><div class="split" aria-hidden="true"><i style="width:'+np+'%;background:var(--a-sage)"></i></div><div class="lgd"><span>New <b>'+cur.nv+'</b></span><span>Returning <b>'+cur.rv+'</b></span></div></section>'+
  '</div>';
  const act=activity();
  body+='<section class="panel"><h2>Recent activity</h2>'+(act.length?'<div class="tw"><table><thead><tr><th>When</th><th>Event</th><th>Visitor</th><th>Device</th></tr></thead><tbody>'+act.map(a=>'<tr><td title="'+esc(when(a.t))+'">'+esc(ago(a.t))+' <span class="mut">'+esc(when(a.t))+'</span></td><td><span class="tag t-'+a.k+'"><i></i>'+EVL[a.k]+'</span></td><td class="mut">'+esc(short(a.id))+'</td><td>'+a.d+'</td></tr>').join('')+'</tbody></table></div>':'<p class="mut">Nothing recorded yet.</p>')+'</section>';
  const vs=data().slice().sort((a,b)=>String(b.data.last||'')<String(a.data.last||'')?-1:1).slice(0,20);
  body+='<section class="panel"><h2>Visitors</h2>'+(vs.length?'<div class="tw"><table><thead><tr><th>Visitor</th><th>First seen</th><th>Last seen</th><th class="n">Visits</th><th class="n">Sign-ins</th><th class="n">Failed</th></tr></thead><tbody>'+vs.map(r=>{
    let v=0,l=0,f=0;Object.values(r.data.days||{}).forEach(x=>{v+=N(x.v);l+=N(x.l);f+=N(x.f)});
    return'<tr><td class="mut">'+esc(short(r.id))+'</td><td>'+esc(when(r.data.first))+'</td><td>'+esc(when(r.data.last))+'</td><td class="n">'+v+'</td><td class="n">'+l+'</td><td class="n">'+f+'</td></tr>';
  }).join('')+'</tbody></table></div>':'<p class="mut">No visitors yet.</p>')+'<p class="mut">Visitors are anonymous. Only a short random ID is stored, never a name or email.</p></section>';
  root.innerHTML=shell(body,ctl);
  wire(list,cur);
}
function wire(list,cur){
  const svg=document.getElementById('chsvg'),gl=document.getElementById('gl'),ro=document.getElementById('ro');
  if(!svg||!ro||list.length<2)return;
  const W=720,L=34,R=12,iw=W-L-R,n=list.length,def=ro.innerHTML;
  const at=e=>{const r=svg.getBoundingClientRect();const x=(e.clientX-r.left)/r.width*W;return Math.max(0,Math.min(n-1,Math.round((x-L)/(iw/(n-1)))))};
  svg.addEventListener('pointermove',e=>{const i=at(e),x=L+i*iw/(n-1);gl.setAttribute('x1',x);gl.setAttribute('x2',x);gl.setAttribute('visibility','visible');ro.innerHTML=readout(list,cur,i)});
  svg.addEventListener('pointerleave',()=>{gl.setAttribute('visibility','hidden');ro.innerHTML=def});
}
root.addEventListener('click',e=>{
  const b=e.target.closest('button');if(!b)return;
  if(b.dataset.r){range=b.dataset.r==='all'?'all':+b.dataset.r;render();return}
  const a=b.dataset.act;
  if(a==='back')location.hash='';
  else if(a==='sample'){sample=true;render()}
  else if(a==='real'){sample=false;render()}
});
async function start(){
  if(started)return;
  started=true;render();
  try{
    if(!window.claude)throw 0;
    const[db,user]=await Promise.all([claude.use('db'),claude.use('user')]);
    if(user){
      const ok=(typeof user.isOwner==='function'&&user.isOwner())||(typeof user.canEdit==='function'&&user.canEdit());
      if(!ok){locked=true;render();return}
    }
    if(!db){state='nodb';render();return}
    timerId=setTimeout(()=>{if(!live){state='slow';render()}},10000);
    db.collection('visitors').onSnapshot(s=>{
      if(!s.metadata.fromCache){live=true;clearTimeout(timerId)}
      rows=s.docs.map(d=>({id:d.id,data:d.data()||{}}));
      state='ok';render();
    },()=>{state='err';render()});
  }catch(e){state='nodb';render()}
}
function route(){
  const on=location.hash==='#admin';
  app.hidden=on;root.hidden=!on;
  if(on){start();scrollTo(0,0)}
}
addEventListener('hashchange',route);
route();
})();
</script>
